x-e2e-volume: &e2e-volume
  type: volume
  volume:
    nocopy: true

services:
  seed:
    image: @@IMAGE_VAULTWARDEN@@
    pull_policy: never
    platform: linux/amd64
    profiles: ["seed"]
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        for directory in /data /staging /cache /restore /config /backup-credentials /maintenance-credentials /restic-credentials /notifier-credentials; do
          test -z "$$(ls -A "$$directory")"
          chmod 0700 "$$directory"
        done
        umask 077
        cat > /config/backup.yaml <<'EOF'
        schema_version: 2

        targets:
          - name: primary
            repository: s3:http://moto:5000/vaultwarden-less-e2e/repository
            restic_options:
              s3.bucket-lookup: path
              s3.region: us-east-1

        notifiers: []
        EOF
        cat > /backup-credentials/credentials.yaml <<'EOF'
        schema_version: 2
        targets:
          primary:
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
        EOF
        cp /backup-credentials/credentials.yaml /maintenance-credentials/credentials.yaml
        printf '%s\n' 'e2e-restic-password' > /restic-credentials/primary
        cat > /notifier-credentials/credentials.yaml <<'EOF'
        schema_version: 2
        notifiers: {}
        EOF
        chmod 0600 /config/backup.yaml /backup-credentials/credentials.yaml /maintenance-credentials/credentials.yaml /restic-credentials/primary /notifier-credentials/credentials.yaml
        chown -R 10000:10000 /data /staging /cache /restore /config /backup-credentials /maintenance-credentials /restic-credentials /notifier-credentials
    volumes:
      - <<: *e2e-volume
        source: e2e-data
        target: /data
      - <<: *e2e-volume
        source: e2e-staging
        target: /staging
      - <<: *e2e-volume
        source: e2e-cache
        target: /cache
      - <<: *e2e-volume
        source: e2e-restore
        target: /restore
      - <<: *e2e-volume
        source: e2e-config
        target: /config
      - <<: *e2e-volume
        source: e2e-backup-credentials
        target: /backup-credentials
      - <<: *e2e-volume
        source: e2e-maintenance-credentials
        target: /maintenance-credentials
      - <<: *e2e-volume
        source: e2e-restic-credentials
        target: /restic-credentials
      - <<: *e2e-volume
        source: e2e-notifier-credentials
        target: /notifier-credentials

  moto:
    image: @@IMAGE_MOTO@@
    pull_policy: never
    platform: linux/amd64
    restart: "no"
    command: ["-H", "0.0.0.0"]
    networks:
      backup-outbound:
        aliases: ["moto"]
      maintenance-outbound:
        aliases: ["moto"]

  vaultwarden:
    env_file: !reset []
    environment:
      DOMAIN: @@E2E_DOMAIN@@
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "80"
      DATA_FOLDER: /data
      DATABASE_URL: sqlite:///data/db.sqlite3
      RSA_KEY_FILENAME: /data/rsa_key
      ATTACHMENTS_FOLDER: /data/attachments
      SENDS_FOLDER: /data/sends
      WEB_VAULT_ENABLED: "false"
      ENABLE_WEBSOCKET: "false"
      PUSH_ENABLED: "false"
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_VERIFY: "false"
      INVITATIONS_ALLOWED: "true"
      DISABLE_ICON_DOWNLOAD: "true"
      LOG_LEVEL: warn
    volumes: !override
      - <<: *e2e-volume
        source: e2e-data
        target: /data

  proxy:
    ports: !override
      - "127.0.0.1:@@PORT_PROXY_E2E@@:8080"

  backup:
    volumes: !override
      - <<: *e2e-volume
        source: e2e-data
        target: /data
        read_only: true
      - <<: *e2e-volume
        source: e2e-staging
        target: /staging
      - <<: *e2e-volume
        source: e2e-cache
        target: /cache
      - <<: *e2e-volume
        source: e2e-config
        target: /config
        read_only: true
      - <<: *e2e-volume
        source: e2e-backup-credentials
        target: /run/credentials/role
        read_only: true
      - <<: *e2e-volume
        source: e2e-restic-credentials
        target: /run/credentials/restic
        read_only: true
      - <<: *e2e-volume
        source: e2e-notifier-credentials
        target: /run/credentials/notifiers
        read_only: true

  maintenance:
    volumes: !override
      - <<: *e2e-volume
        source: e2e-cache
        target: /cache
      - <<: *e2e-volume
        source: e2e-config
        target: /config
        read_only: true
      - <<: *e2e-volume
        source: e2e-maintenance-credentials
        target: /run/credentials/role
        read_only: true
      - <<: *e2e-volume
        source: e2e-restic-credentials
        target: /run/credentials/restic
        read_only: true

  restore:
    volumes: !override
      - <<: *e2e-volume
        source: e2e-restore
        target: /restore
      - <<: *e2e-volume
        source: e2e-cache
        target: /cache
      - <<: *e2e-volume
        source: e2e-config
        target: /config
        read_only: true
      - <<: *e2e-volume
        source: e2e-maintenance-credentials
        target: /run/credentials/role
        read_only: true
      - <<: *e2e-volume
        source: e2e-restic-credentials
        target: /run/credentials/restic
        read_only: true

  drill-copy:
    volumes: !override
      - <<: *e2e-volume
        source: e2e-restore
        target: /source
        read_only: true
      - <<: *e2e-volume
        source: e2e-drill-data
        target: /drill-data

  drill-vaultwarden:
    environment:
      DOMAIN: @@E2E_DOMAIN@@
    ports: !override
      - "127.0.0.1:@@PORT_DRILL_E2E@@:80"
    volumes: !override
      - <<: *e2e-volume
        source: e2e-drill-data
        target: /data

networks:
  proxy-ingress:
    driver_opts: !reset {}
  drill-ingress:
    driver_opts: !reset {}

volumes:
  e2e-data: {}
  e2e-staging: {}
  e2e-cache: {}
  e2e-restore: {}
  e2e-config: {}
  e2e-backup-credentials: {}
  e2e-maintenance-credentials: {}
  e2e-restic-credentials: {}
  e2e-notifier-credentials: {}
  e2e-drill-data: {}
