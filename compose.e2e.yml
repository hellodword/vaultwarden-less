services:
  moto:
    image: ghcr.io/getmoto/motoserver:5.2.2@sha256:0349ef6ecb9cd041293026accda0ea71bfa09925dffae3d76d120d15ecc76971
    platform: linux/amd64
    restart: "no"
    command: ["-H", "0.0.0.0"]
    networks:
      backup-outbound:
        aliases: ["moto"]
      maintenance-outbound:
        aliases: ["moto"]

  vaultwarden:
    environment:
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "true"

networks:
  proxy-ingress:
    driver_opts: {}
