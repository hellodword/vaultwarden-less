# The one-shot maintenance role needs the provider permissions required by
# Restic check, unlock, restore, and forget/prune, including object deletion.
# Keep it separate from the resident backup role and expose it only when needed.
# Empty values are intentional and make validation fail until configured.
targets:
  primary:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
  b2:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
