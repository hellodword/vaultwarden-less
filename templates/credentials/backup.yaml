# The resident backup role needs only the provider permissions required by
# Restic to list/read repository metadata, acquire locks, and write snapshots.
# Use a dedicated least-privilege identity; do not reuse maintenance keys.
# Empty values are intentional and make validation fail until configured.
targets:
  primary:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
  b2:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
