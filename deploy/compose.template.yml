x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  user: "@@USER_UID@@:@@USER_GID@@"
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-runtime-fs: &runtime-fs
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

services:
  vaultwarden:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_VAULTWARDEN@@
    pull_policy: never
    hostname: vaultwarden
    env_file:
      - path: ./config/vaultwarden/vaultwarden.env
        required: true
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    networks: [app]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_PROXY@@
    pull_policy: never
    hostname: proxy
    entrypoint: ["/bin/vaultwarden-less-proxy"]
    command: ["serve"]
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "127.0.0.1:@@PORT_PROXY@@:8080"
    networks: [app, events, proxy-ingress]
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/bin/vaultwarden-less-proxy", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_BACKUP@@
    pull_policy: never
    hostname: backup
    entrypoint: ["/bin/vaultwarden-less-backup"]
    command: ["serve", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./staging
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/backup
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/restic
        target: /run/credentials/restic
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/notifiers
        target: /run/credentials/notifiers
        read_only: true
        bind:
          create_host_path: false
    networks: [events, backup-outbound]
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/bin/vaultwarden-less-backup", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  maintenance:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_BACKUP@@
    pull_policy: never
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["/bin/vaultwarden-less-backup"]
    command: ["repo", "snapshots", "--target", "primary", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/restic
        target: /run/credentials/restic
        read_only: true
        bind:
          create_host_path: false
    networks: [maintenance-outbound]
    stop_grace_period: 2m10s

  restore:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_BACKUP@@
    pull_policy: never
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["/bin/vaultwarden-less-backup"]
    command: ["restore", "--target", "primary", "--output", "/restore/prepared", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./restore
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/restic
        target: /run/credentials/restic
        read_only: true
        bind:
          create_host_path: false
    networks: [maintenance-outbound]
    stop_grace_period: 2m10s

  drill-copy:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_VAULTWARDEN@@
    pull_policy: never
    profiles: ["drill"]
    restart: "no"
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        source_path="/source/$$1"
        test -f "$$source_path/manifest.json"
        test -d "$$source_path/data"
        test -z "$$(ls -A /drill-data)"
        cp -a "$$source_path/data/." /drill-data/
        chown -R "@@USER_UID@@:@@USER_GID@@" /drill-data
      - drill-copy
      - "@@RESTORE_NAME_DRILL@@"
    network_mode: none
    volumes:
      - type: bind
        source: ./restore
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: drill-data
        target: /drill-data

  drill-vaultwarden:
    <<: [*service-defaults, *runtime-fs]
    image: @@IMAGE_VAULTWARDEN@@
    pull_policy: never
    profiles: ["drill"]
    restart: "no"
    depends_on:
      drill-copy:
        condition: service_completed_successfully
    environment:
      DOMAIN: http://127.0.0.1:@@PORT_DRILL@@
      DATA_FOLDER: /data
      DATABASE_URL: sqlite:///data/db.sqlite3
      RSA_KEY_FILENAME: /data/rsa_key
      ATTACHMENTS_FOLDER: /data/attachments
      SENDS_FOLDER: /data/sends
      WEB_VAULT_ENABLED: "false"
      ENABLE_WEBSOCKET: "false"
      PUSH_ENABLED: "false"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      DISABLE_ICON_DOWNLOAD: "true"
    volumes:
      - type: volume
        source: drill-data
        target: /data
    ports:
      - "127.0.0.1:@@PORT_DRILL@@:80"
    networks: [drill, drill-ingress]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  app:
    internal: true
  events:
    internal: true
  proxy-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  backup-outbound: {}
  maintenance-outbound: {}
  drill:
    internal: true
  drill-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  drill-data: {}
