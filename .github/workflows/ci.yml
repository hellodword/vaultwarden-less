name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nix
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://nixos.org/nix/install --output /tmp/nix-install
          sh /tmp/nix-install --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
      - name: Run flake checks
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake check
      - name: Run fast project checks
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop --command just ci-fast

  full:
    name: Full checks
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nix
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://nixos.org/nix/install --output /tmp/nix-install
          sh /tmp/nix-install --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      - name: Run flake checks
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake check
      - name: Run full project checks
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop --command just ci-full

  release:
    name: Publish the product image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: full
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/vaultwarden-less
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
      - name: Require a SemVer image tag
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -n "$IMAGE_VERSION"
          [[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the single product image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: PRODUCT_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
