name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nix on the GitHub-hosted runner
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://nixos.org/nix/install --output /tmp/nix-install
          sh /tmp/nix-install --daemon
      - name: Verify flake support and metadata
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix config show experimental-features | grep --word-regexp nix-command
          nix config show experimental-features | grep --word-regexp flakes
          nix flake metadata --no-write-lock-file
      - name: Check flake wiring
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake check
      - name: Run the fast product gate
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix run .#just -- ci-fast

  full:
    name: Full checks
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nix on the GitHub-hosted runner
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://nixos.org/nix/install --output /tmp/nix-install
          sh /tmp/nix-install --daemon
      - name: Verify flake support and metadata
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix config show experimental-features | grep --word-regexp nix-command
          nix config show experimental-features | grep --word-regexp flakes
          nix flake metadata --no-write-lock-file
      - name: Run the full product gate
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix run .#just -- ci-full

  release:
    name: Publish the product image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: full
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nix on the GitHub-hosted runner
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://nixos.org/nix/install --output /tmp/nix-install
          sh /tmp/nix-install --daemon
      - name: Verify flake support and metadata
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix config show experimental-features | grep --word-regexp nix-command
          nix config show experimental-features | grep --word-regexp flakes
          nix flake metadata --no-write-lock-file
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish the VERSION-matched image
        shell: bash
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vaultwarden-less"
          nix run .#just -- release "$repository"
