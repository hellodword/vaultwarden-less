name: vaultwarden-less

x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  user: "${RUNTIME_UID:?RUNTIME_UID is required}:${RUNTIME_GID:?RUNTIME_GID is required}"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 2m
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "3"

x-deployment-environment: &deployment-environment
  DEPLOYMENT_ROOT: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}"
  RUNTIME_UID: "${RUNTIME_UID:?RUNTIME_UID is required}"
  RUNTIME_GID: "${RUNTIME_GID:?RUNTIME_GID is required}"
  LISTEN_PORT: "${LISTEN_PORT:?LISTEN_PORT is required}"

x-backup-config-mount: &backup-config-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/backup.yaml"
  target: /config/backup.yaml
  read_only: true
  bind:
    create_host_path: false

x-restic-credentials-mount: &restic-credentials-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/restic"
  target: /run/credentials/restic
  read_only: true
  bind:
    create_host_path: false

x-cache-mount: &cache-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/cache"
  target: /cache
  bind:
    create_host_path: false

services:
  vaultwarden:
    <<: *service-defaults
    image: "vaultwarden-less-vaultwarden:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: vaultwarden
    environment: *deployment-environment
    env_file:
      - "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/vaultwarden.env"
    volumes:
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        bind:
          create_host_path: false
    networks:
      app:
        aliases: [vaultwarden]
    healthcheck:
      test: [CMD, /healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backup:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: backup
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [serve]
    environment: *deployment-environment
    volumes:
      - *backup-config-mount
      - *restic-credentials-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/staging"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/backup.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/notifiers.yaml"
        target: /run/credentials/notifiers.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      events:
        aliases: [backup]
      backup-outbound: {}
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-backup, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6

  proxy:
    <<: *service-defaults
    image: "vaultwarden-less-proxy:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: proxy
    entrypoint: [/bin/vaultwarden-less-proxy]
    command: [serve]
    environment: *deployment-environment
    depends_on:
      vaultwarden:
        condition: service_healthy
      backup:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LISTEN_PORT:?LISTEN_PORT is required}:8080"
    networks:
      - app
      - events
      - proxy-ingress
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-proxy, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6

  config-check-backup:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    profiles: [maintenance]
    restart: "no"
    network_mode: none
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [config, validate, --role, backup]
    environment: *deployment-environment
    volumes:
      - *backup-config-mount
      - *restic-credentials-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}"
        target: /deployment-root
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/vaultwarden.env"
        target: /deployment/vaultwarden.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/staging"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/restore"
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/backup.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/notifiers.yaml"
        target: /run/credentials/notifiers.yaml
        read_only: true
        bind:
          create_host_path: false

  config-check-maintenance:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    profiles: [maintenance]
    restart: "no"
    network_mode: none
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [config, validate, --role, maintenance]
    environment: *deployment-environment
    volumes:
      - *backup-config-mount
      - *restic-credentials-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}"
        target: /deployment-root
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/vaultwarden.env"
        target: /deployment/vaultwarden.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/staging"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/restore"
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/maintenance.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false

  maintenance:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    profiles: [maintenance]
    restart: "no"
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [--help]
    environment: *deployment-environment
    volumes:
      - *backup-config-mount
      - *restic-credentials-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/staging"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/restore"
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/maintenance.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - maintenance-outbound

  restore:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    profiles: [restore]
    restart: "no"
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [--help]
    environment: *deployment-environment
    volumes:
      - *backup-config-mount
      - *restic-credentials-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/restore"
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/maintenance.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - maintenance-outbound

networks:
  app:
    internal: true
  events:
    internal: true
  proxy-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  backup-outbound: {}
  maintenance-outbound: {}
