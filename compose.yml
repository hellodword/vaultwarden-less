# Run docker compose in the deployment directory. Bind paths are relative to this file.
name: vaultwarden-less

x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 150s
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "3"

services:
  vaultwarden:
    <<: *service-defaults
    image: "vaultwarden/server:1.37.5"
    pull_policy: never
    hostname: vaultwarden
    environment:
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "80"
      CONFIG_FILE: /etc/vaultwarden/config.json
      ADMIN_TOKEN: ""
      DISABLE_ADMIN_TOKEN: "false"
      DATA_FOLDER: /data
      DATABASE_URL: sqlite:///data/db.sqlite3
    env_file:
      - ./config/vaultwarden.env
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backup:
    <<: *service-defaults
    image: "vaultwarden-less-backup:development"
    pull_policy: never
    hostname: backup
    command: [serve]
    tmpfs: []
    environment:
      TMPDIR: /cache/work
      SQLITE_TMPDIR: /cache/work
    depends_on:
      vaultwarden:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./rules
        target: /rules
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/backup
        target: /run/credentials/backup
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-backup, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6

  proxy:
    <<: *service-defaults
    image: "vaultwarden-less-proxy:development"
    pull_policy: never
    hostname: proxy
    command: [serve]
    depends_on:
      vaultwarden:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./rules
        target: /rules
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Edit the HOST port (middle value) here when needed. Container port 8080
      # is fixed. TLS, public listeners and trusted forwarded headers belong
      # to the external reverse proxy; this listener stays on host loopback.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-proxy, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6
