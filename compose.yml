name: vaultwarden-less

x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.2
    hostname: vaultwarden
    user: "${PUID:?run scripts/init and set PUID}:${PGID:?run scripts/init and set PGID}"
    env_file:
      - .env.vaultwarden
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - ./data:/data:rw
    networks:
      - app
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    <<: *service-defaults
    image: ghcr.io/hellodword/vaultwarden-less-proxy:1.0.0
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    hostname: proxy
    user: "${PUID:?run scripts/init and set PUID}:${PGID:?run scripts/init and set PGID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      vaultwarden:
        condition: service_healthy
    command: ["--config", "/config/proxy.json"]
    ports:
      - "${LISTEN_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - ./config/proxy.json:/config/proxy.json:ro
    networks:
      - app
      - events
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-proxy", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    <<: *service-defaults
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    hostname: backup
    user: "${PUID:?run scripts/init and set PUID}:${PGID:?run scripts/init and set PGID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      vaultwarden:
        condition: service_healthy
    command: ["serve", "--config", "/config/backup.json"]
    volumes:
      - ./data:/data:ro
      - ./state:/state:rw
      - ./staging:/staging:rw
      - ./cache:/cache:rw
      - ./repositories:/repositories:rw
      - ./secrets:/run/secrets:ro
      - ./config/backup.json:/config/backup.json:ro
    networks:
      - events
      - outbound
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-backup", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  maintenance:
    platform: linux/amd64
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    profiles: ["maintenance"]
    user: "${PUID:?run scripts/init and set PUID}:${PGID:?run scripts/init and set PGID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    command: ["repo", "snapshots", "--target", "primary", "--config", "/config/backup.json"]
    volumes:
      - ./cache:/cache:rw
      - ./repositories:/repositories:rw
      - ./secrets:/run/secrets:ro
      - ./config/backup.json:/config/backup.json:ro
    networks:
      - outbound
    stop_grace_period: 2m10s

  restore:
    platform: linux/amd64
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    profiles: ["restore"]
    user: "${PUID:?run scripts/init and set PUID}:${PGID:?run scripts/init and set PGID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    command: ["restore", "--target", "primary", "--output", "/restore/prepared", "--config", "/config/backup.json"]
    volumes:
      - ./restore:/restore:rw
      - ./cache:/cache:rw
      - ./repositories:/repositories:rw
      - ./secrets:/run/secrets:ro
      - ./config/backup.json:/config/backup.json:ro
    networks:
      - outbound
    stop_grace_period: 2m10s

networks:
  app:
    internal: true
  events:
    internal: true
  outbound: {}
