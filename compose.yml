name: vaultwarden-less

x-product-image: &product-image ghcr.io/hellodword/vaultwarden-less:${PRODUCT_VERSION:-dev}
x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  user: "65532:65532"
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.2@sha256:5d326778c22f063d093d6b0c9c766a28249561632266776f2c93132ab0ad3a80
    hostname: vaultwarden
    env_file:
      - path: ${VAULTWARDEN_ENV_FILE:-.env.vaultwarden}
        required: true
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    networks:
      - app
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    <<: *service-defaults
    image: *product-image
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT_VERSION: "${PRODUCT_VERSION:-dev}"
    hostname: proxy
    entrypoint: ["/usr/local/bin/vaultwarden-less-proxy"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LISTEN_PORT:-8080}:8080"
    networks:
      - app
      - events
      - proxy-ingress
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-proxy", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    <<: *service-defaults
    image: *product-image
    hostname: backup
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./staging
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/backup
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    command: ["serve", "--config", "/config/backup.yaml"]
    networks:
      - events
      - backup-outbound
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-backup", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  maintenance:
    <<: *service-defaults
    image: *product-image
    profiles: ["maintenance"]
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    command: ["repo", "snapshots", "--target", "primary", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    networks:
      - maintenance-outbound
    stop_grace_period: 2m10s

  restore:
    <<: *service-defaults
    image: *product-image
    profiles: ["restore"]
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    command: ["restore", "--target", "primary", "--output", "/restore/prepared", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./restore
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    networks:
      - maintenance-outbound
    stop_grace_period: 2m10s

networks:
  app:
    internal: true
  events:
    internal: true
  proxy-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  backup-outbound: {}
  maintenance-outbound: {}
