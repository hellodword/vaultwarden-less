name: vaultwarden-less

x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  user: "${RUNTIME_UID:?RUNTIME_UID is required}:${RUNTIME_GID:?RUNTIME_GID is required}"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 2m
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "3"

x-backup-config-mount: &backup-config-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/backup.yaml"
  target: /config/backup.yaml
  read_only: true
  bind:
    create_host_path: false

x-restic-passwords-mount: &restic-passwords-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/restic"
  target: /run/credentials/restic
  read_only: true
  bind:
    create_host_path: false

x-cache-mount: &cache-mount
  type: bind
  source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/cache"
  target: /cache
  bind:
    create_host_path: false

services:
  vaultwarden:
    <<: *service-defaults
    image: "vaultwarden-less-vaultwarden:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: vaultwarden
    environment:
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "80"
      DATA_FOLDER: /data
      DATABASE_URL: sqlite:///data/db.sqlite3
      RSA_KEY_FILENAME: /data/rsa_key
      ATTACHMENTS_FOLDER: /data/attachments
      SENDS_FOLDER: /data/sends
      WEB_VAULT_ENABLED: "false"
      DISABLE_ICON_DOWNLOAD: "true"
      ICON_CACHE_TTL: "0"
    env_file:
      - "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/config/vaultwarden.env"
    volumes:
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backup:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: backup
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [serve]
    volumes:
      - *backup-config-mount
      - *restic-passwords-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/data"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/staging"
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/backup.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-backup, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6

  proxy:
    <<: *service-defaults
    image: "vaultwarden-less-proxy:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    hostname: proxy
    entrypoint: [/bin/vaultwarden-less-proxy]
    command: [serve]
    depends_on:
      vaultwarden:
        condition: service_healthy
      backup:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LISTEN_PORT:?LISTEN_PORT is required}:8080"
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-proxy, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6

  maintenance:
    <<: *service-defaults
    image: "vaultwarden-less-backup:${VWLESS_IMAGE_TAG:?VWLESS_IMAGE_TAG is required}"
    pull_policy: never
    profiles: [maintenance]
    restart: "no"
    entrypoint: [/bin/vaultwarden-less-backup]
    command: [--help]
    volumes:
      - *backup-config-mount
      - *restic-passwords-mount
      - *cache-mount
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/restore"
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOYMENT_ROOT:?DEPLOYMENT_ROOT is required}/credentials/maintenance.yaml"
        target: /run/credentials/role.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /bin/vaultwarden-less-backup, version]
      interval: 10s
      timeout: 3s
      retries: 3
