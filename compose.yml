name: vaultwarden-less

x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.2
    hostname: vaultwarden
    user: "${PUID:?set PUID in .env to the non-root owner UID}:${PGID:?set PGID in .env to the non-root owner GID}"
    env_file:
      - .env.vaultwarden
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    networks:
      - app
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    <<: *service-defaults
    image: ghcr.io/hellodword/vaultwarden-less-proxy:1.0.0
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    hostname: proxy
    user: "${PUID:?set PUID in .env to the non-root owner UID}:${PGID:?set PGID in .env to the non-root owner GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "${LISTEN_HOST:-127.0.0.1}:${LISTEN_PORT:-8080}:8080"
    networks:
      - app
      - events
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-proxy", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    <<: *service-defaults
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    hostname: backup
    user: "${PUID:?set PUID in .env to the non-root owner UID}:${PGID:?set PGID in .env to the non-root owner GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      vaultwarden:
        condition: service_healthy
    command: ["serve", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./staging
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/backup
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    networks:
      - events
      - outbound
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/vaultwarden-less-backup", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  maintenance:
    platform: linux/amd64
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    profiles: ["maintenance"]
    user: "${PUID:?set PUID in .env to the non-root owner UID}:${PGID:?set PGID in .env to the non-root owner GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    command: ["repo", "snapshots", "--target", "primary", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    networks:
      - outbound
    stop_grace_period: 2m10s

  restore:
    platform: linux/amd64
    image: ghcr.io/hellodword/vaultwarden-less-backup:1.0.0
    profiles: ["restore"]
    user: "${PUID:?set PUID in .env to the non-root owner UID}:${PGID:?set PGID in .env to the non-root owner GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/vaultwarden-less-backup"]
    command: ["restore", "--target", "primary", "--output", "/restore/prepared", "--config", "/config/backup.yaml"]
    volumes:
      - type: bind
        source: ./restore
        target: /restore
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/common
        target: /run/credentials/common
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./credentials/maintenance
        target: /run/credentials/role
        read_only: true
        bind:
          create_host_path: false
    networks:
      - outbound
    stop_grace_period: 2m10s

networks:
  app:
    internal: true
  events:
    internal: true
  outbound: {}
