[vaultwarden]
repository = "https://github.com/dani-garcia/vaultwarden"
source_tag = "1.37.3"
source_commit = "eb212e23fad88e6136723f43e5b73543fa7026d3"
database_migration = "20260505120000"
schema_contract = "internal/upstream/vaultwarden-schema.json"
recovery_projection = "internal/upstream/recovery-projection.json"
audit_paths = [
  "migrations/sqlite/**",
  "src/api/**",
  "src/db/**",
  "src/main.rs",
  "docker/**",
]

[bitwarden_cli]
repository = "https://github.com/bitwarden/clients"
# 2026.9.x requires an endpoint absent from stable Vaultwarden; see maintenance.md.
source_tag = "cli-v2026.8.0"
source_commit = "77d62ade0fe91a502b7cfb9d8d894c2746c5609a"
source_hash = "sha256-Kz7vy3mt4uLGA6wGtH527P5vY55UYSZtq6e8IyNJvc4="
npm_deps_hash = "sha256-5i6/TlqBhPLv00tN0sxFA/iRQ8QRyUxhCqYkhVBLz3w="
audit_paths = [
  "apps/cli/**",
  "libs/auth/**",
  "libs/common/**",
  "libs/key-management/**",
  "libs/legacy-crypto/**",
  "libs/node/**",
]

[restic]
repository = "https://github.com/restic/restic"
source_tag = "v0.19.1"
source_commit = "6aa3a516ce654808a1f28f9fa21e9b7c8e6e90bf"
audit_paths = [
  "cmd/restic/**",
  "internal/**",
  "go.mod",
  "go.sum",
  "CHANGELOG.md",
]

[moto]
repository = "https://github.com/getmoto/moto"
source_tag = "5.2.3"
source_commit = "3acd662d8196355a1dbbcdb36f7b9ee63d6c70d9"
source_hash = "sha256-7wE44MYdRf9p3/ac2qOPpLaS0bkpoh84R+rdJp5oycU="
audit_paths = [
  "moto/s3/**",
  "moto/server.py",
  "pyproject.toml",
  "CHANGELOG.md",
]

[go]
repository = "https://go.googlesource.com/go"
source_tag = "go1.27.1"
source_commit = "862c888e612ac346c7c4d99c9392bdfd265f33b0"
audit_paths = [
  "src/cmd/**",
  "src/crypto/**",
  "src/database/sql/**",
  "src/net/**",
  "src/os/**",
  "src/runtime/**",
]

