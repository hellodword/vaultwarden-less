[vaultwarden]
repository = "https://github.com/dani-garcia/vaultwarden"
source_tag = "1.37.2"
source_commit = "46d71107f5094460dd5ecbe1dbac6e6c71e5189a"
database_migration = "20260505120000"
schema_contract = "internal/upstream/vaultwarden-schema.json"
recovery_projection = "internal/upstream/recovery-projection.json"
audit_paths = [
  "migrations/sqlite/**",
  "src/api/**",
  "src/db/**",
  "src/main.rs",
  "docker/**",
]

[bitwarden_cli]
repository = "https://github.com/bitwarden/clients"
source_tag = "cli-v2026.7.0"
source_commit = "82186c3d92c0da14aa86c848b781d949a8a6202a"
audit_paths = [
  "apps/cli/**",
  "libs/auth/**",
  "libs/common/**",
  "libs/key-management/**",
  "libs/node/**",
]

[restic]
repository = "https://github.com/restic/restic"
source_tag = "v0.19.1"
source_commit = "6aa3a516ce654808a1f28f9fa21e9b7c8e6e90bf"
audit_paths = [
  "cmd/restic/**",
  "internal/**",
  "go.mod",
  "go.sum",
  "CHANGELOG.md",
]

[moto]
repository = "https://github.com/getmoto/moto"
source_tag = "5.2.2"
source_commit = "837595545cc4a4bb8fede2cff84b2b2373443981"
audit_paths = [
  "moto/s3/**",
  "moto/server.py",
  "pyproject.toml",
  "CHANGELOG.md",
]

[go]
repository = "https://go.googlesource.com/go"
source_tag = "go1.26.5"
source_commit = "c19862e5f8415b4f24b189d065ed739517c548ba"
audit_paths = [
  "src/cmd/**",
  "src/crypto/**",
  "src/database/sql/**",
  "src/net/**",
  "src/os/**",
  "src/runtime/**",
]
