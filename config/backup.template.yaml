# Copy this file to config/backup.yaml and keep it private (0400 or 0600).
schema_version: 1
target_timeout: 30m
maintenance_timeout: 12h
targets: []
notifiers: []

# Every target uses the Restic S3 API. Examples include AWS S3, Backblaze B2
# S3, Tencent COS, Alibaba OSS, Scaleway Object Storage, and Cloudflare R2.
# The endpoint may be HTTPS or HTTP; HTTP is accepted with a warning.
# targets:
#   - name: primary
#     repository: s3:https://objects.example.test/bucket/vaultwarden
#     restic_options:
#       s3.bucket-lookup: path
#       s3.region: ap-singapore
