services:
  drill-vaultwarden:
    image: vaultwarden/server:1.37.2@sha256:5d326778c22f063d093d6b0c9c766a28249561632266776f2c93132ab0ad3a80
    platform: linux/amd64
    profiles: ["drill"]
    restart: unless-stopped
    user: "${DEPLOY_UID:?set DEPLOY_UID}:${DEPLOY_GID:?set DEPLOY_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      DOMAIN: ${DRILL_DOMAIN:-http://127.0.0.1:8081}
      DATA_FOLDER: /data
      DATABASE_URL: sqlite:///data/db.sqlite3
      RSA_KEY_FILENAME: /data/rsa_key
      ATTACHMENTS_FOLDER: /data/attachments
      WEB_VAULT_ENABLED: "false"
      ENABLE_WEBSOCKET: "false"
      PUSH_ENABLED: "false"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      DISABLE_ICON_DOWNLOAD: "true"
    volumes:
      - type: bind
        source: ${DRILL_RECOVERY_PATH:?set DRILL_RECOVERY_PATH in .env}/data
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${DRILL_PORT:-8081}:80"
    networks:
      - drill
      - drill-ingress
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  drill:
    internal: true
  drill-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
